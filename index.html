<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة العجلة والشات الصوتي الجماعي</title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- PeerJS for Audio Chat -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; padding: 20px; gap: 20px; }
        
        #join-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
        }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; text-align: center; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card h2 { margin-bottom: 20px; color: #38bdf8; }
        input {
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #334155;
            border-radius: 8px; background: #0f172a; color: #fff; text-align: center; font-size: 16px;
        }
        .btn {
            width: 100%; padding: 12px; background: #38bdf8; color: #0f172a;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px;
        }
        .btn:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }

        .game-main { flex: 2; background: #1e293b; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .header-info h2 { color: #38bdf8; font-size: 24px; text-align: center; }
        .header-info h3 { color: #f59e0b; margin-top: 5px; text-align: center; }

        .wheel-container { position: relative; width: 300px; height: 300px; margin: 10px 0; }
        .pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 25px solid #ef4444; z-index: 10;
        }
        #canvas { background: #0f172a; border-radius: 50%; border: 6px solid #38bdf8; }

        #question-box {
            background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px;
            padding: 15px; width: 100%; text-align: center; display: none; margin-top: 15px;
        }
        #question-text { color: #f43f5e; font-size: 18px; margin-bottom: 10px; }

        .sidebar { flex: 1; background: #1e293b; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .section-box { background: #0f172a; padding: 12px; border-radius: 10px; }
        .section-box h4 { margin-bottom: 8px; color: #38bdf8; }

        #players-list { list-style: none; max-height: 100px; overflow-y: auto; }
        #players-list li { padding: 4px 8px; background: #1e293b; margin-bottom: 4px; border-radius: 4px; }

        #chat-box { flex: 1; min-height: 200px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 8px; font-size: 14px; }
        .chat-input-group { display: flex; gap: 8px; }
        .chat-input-group input { width: 75%; }
        .chat-input-group button { width: 25%; margin-top: 8px; }

        .controls-row { display: flex; gap: 10px; }
        .controls-row button { flex: 1; font-size: 13px; }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="join-screen">
        <div class="card">
            <h2>دخول اللعبة 🎯</h2>
            <input type="text" id="username-input" placeholder="اسمك">
            <input type="text" id="room-input" placeholder="رقم الغرفة (مثال: 777)">
            <button class="btn" onclick="joinGame()">دخول الان</button>
        </div>
    </div>

    <!-- اللعبة الرئيسية -->
    <div class="game-main">
        <div class="header-info">
            <h2 id="room-title">الغرفة: -</h2>
            <h3 id="turn-title">انتظار اللاعبين...</h3>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="canvas" width="300" height="300"></canvas>
        </div>

        <button id="spin-btn" class="btn" style="width: 200px;" onclick="spinWheel()" disabled>لف العجلة!</button>

        <div id="question-box">
            <h3 id="question-text"></h3>
            <div id="answer-section">
                <input type="text" id="answer-input" placeholder="اكتب إجابتك هنا...">
                <button class="btn" onclick="submitAnswer()">إرسال الإجابة</button>
            </div>
        </div>
    </div>

    <!-- اللوحة الجانبية -->
    <div class="sidebar">
        <div class="section-box">
            <h4>👥 المتواجدون</h4>
            <ul id="players-list"></ul>
        </div>

        <div class="section-box">
            <h4>🎙️ الشات الصوتي</h4>
            <div class="controls-row">
                <button id="mic-btn" class="btn" onclick="toggleMic()">كتم المايك 🎙️</button>
                <button id="audio-btn" class="btn" onclick="toggleAudio()">كتم الصوت 🔊</button>
            </div>
        </div>

        <div class="section-box" style="flex: 1; display: flex; flex-direction: column;">
            <h4>💬 الشات النصي</h4>
            <div id="chat-box"></div>
            <div class="chat-input-group">
                <input type="text" id="chat-input" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <div id="audio-container"></div>

    <script>
        // إعداد Firebase مؤقت للتجربة المباشرة
        const firebaseConfig = {
            databaseURL: "https://wheel-game-demo-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myKey = "", myUsername = "", roomId = "", peerId = "";
        let peer, myStream, currentRoomRef, playersList = [], currentTurnIndex = 0;
        let micEnabled = true, audioEnabled = true;

        const questions = [
            "إيه أكتر موقف محرج حصلك في حياتك؟",
            "لو معاك مليون جنيه دلوقتي، أول حاجة هشتريها إيه؟",
            "مين أكتر حد بتثق فيه في صحابك؟",
            "إيه البلد اللي نفسك تسافرها وتعيش فيها؟",
            "أكتر صفة بتحبها وأكتر صفة بتكرهها في نفسك؟",
            "لو تقدر ترجع بالزمن، هتغير إيه؟"
        ];

        // 1. رسم العجلة
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];
        
        function drawWheel() {
            const sliceAngle = (2 * Math.PI) / colors.length;
            ctx.clearRect(0, 0, 300, 300);
            for (let i = 0; i < colors.length; i++) {
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 140, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fill();
            }
        }
        drawWheel();

        // 2. الانضمام للغرفة وتفعيل الصوت
        async function joinGame() {
            myUsername = document.getElementById('username-input').value.trim();
            roomId = document.getElementById('room-input').value.trim();

            if (!myUsername || !roomId) return alert("اكتب اسمك ورقم الغرفة!");

            document.getElementById('join-screen').style.display = 'none';
            document.getElementById('room-title').innerText = `الغرفة: ${roomId}`;

            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (e) { console.warn("مفيش إذن مايك:", e); }

            peer = new Peer();
            peer.on('open', (id) => {
                peerId = id;
                initFirebase();
            });

            peer.on('call', (call) => {
                call.answer(myStream);
                call.on('stream', (stream) => addAudioStream(call.peer, stream));
            });
        }

        function initFirebase() {
            currentRoomRef = db.ref('rooms/' + roomId);
            const pRef = currentRoomRef.child('players').push();
            myKey = pRef.key;

            pRef.set({ username: myUsername, peerId: peerId });
            pRef.onDisconnect().remove();

            // متابعة اللاعبين
            currentRoomRef.child('players').on('value', (snap) => {
                const val = snap.val() || {};
                playersList = Object.keys(val).map(k => ({ key: k, ...val[k] }));

                // الاتصال الصوتي باللاعبين الجدد
                playersList.forEach(p => {
                    if (p.peerId !== peerId && myStream) {
                        const call = peer.call(p.peerId, myStream);
                        call.on('stream', (stream) => addAudioStream(p.peerId, stream));
                    }
                });

                updateGameState();
            });

            // متابعة العجلة والأدوار
            currentRoomRef.child('state').on('value', (snap) => {
                const state = snap.val();
                if (!state) return;

                currentTurnIndex = state.turnIndex || 0;
                updateGameState();

                if (state.lastSpin && state.lastSpin.timestamp > (window.lastSpinTime || 0)) {
                    window.lastSpinTime = state.lastSpin.timestamp;
                    animateWheel(state.lastSpin.degree, state.lastSpin.question, state.lastSpin.player);
                }
            });

            // متابعة الشات
            currentRoomRef.child('chat').on('child_added', (snap) => {
                const msg = snap.val();
                const box = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.style.margin = '4px 0';
                div.style.color = msg.isAnswer ? '#10b981' : '#f8fafc';
                div.innerHTML = `<strong>${msg.sender}:</strong> ${msg.text}`;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;
            });
        }

        function updateGameState() {
            const list = document.getElementById('players-list');
            list.innerHTML = playersList.map((p, idx) => `<li>${p.username} ${idx === currentTurnIndex ? '👑' : ''}</li>`).join('');

            if (playersList.length > 0) {
                const currentPlayer = playersList[currentTurnIndex % playersList.length];
                document.getElementById('turn-title').innerText = `الدور على: ${currentPlayer ? currentPlayer.username : '-'}`;
                const isMyTurn = currentPlayer && currentPlayer.key === myKey;
                document.getElementById('spin-btn').disabled = !isMyTurn;
            }
        }

        function spinWheel() {
            const randomDegree = Math.floor(Math.random() * 360) + 1440;
            const question = questions[Math.floor(Math.random() * questions.length)];

            currentRoomRef.child('state').update({
                lastSpin: { degree: randomDegree, question: question, player: myUsername, timestamp: Date.now() }
            });
        }

        function animateWheel(targetDegree, question, player) {
            document.getElementById('spin-btn').disabled = true;
            canvas.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.15, 1)';
            canvas.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(() => {
                document.getElementById('question-box').style.display = 'block';
                document.getElementById('question-text').innerText = `سؤال لـ (${player}): ${question}`;
                const currentPlayer = playersList[currentTurnIndex % playersList.length];
                document.getElementById('answer-section').style.display = (currentPlayer && currentPlayer.key === myKey) ? 'block' : 'none';
            }, 4000);
        }

        function submitAnswer() {
            const ans = document.getElementById('answer-input').value.trim();
            if (!ans) return;

            currentRoomRef.child('chat').push({ sender: `إجابة ${myUsername}`, text: ans, isAnswer: true });
            document.getElementById('answer-input').value = '';
            document.getElementById('question-box').style.display = 'none';

            // نقل الدور
            const nextTurn = (currentTurnIndex + 1) % playersList.length;
            currentRoomRef.child('state').update({ turnIndex: nextTurn });
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (input.value.trim()) {
                currentRoomRef.child('chat').push({ sender: myUsername, text: input.value.trim() });
                input.value = '';
            }
        }

        function addAudioStream(pId, stream) {
            if (document.getElementById(`audio-${pId}`)) return;
            const audio = document.createElement('audio');
            audio.id = `audio-${pId}`;
            audio.srcObject = stream;
            audio.autoplay = true;
            document.getElementById('audio-container').appendChild(audio);
        }

        function toggleMic() {
            if (!myStream) return;
            micEnabled = !micEnabled;
            myStream.getAudioTracks()[0].enabled = micEnabled;
            document.getElementById('mic-btn').innerText = micEnabled ? "كتم المايك 🎙️" : "تشغيل المايك 🔇";
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.querySelectorAll('#audio-container audio').forEach(a => a.muted = !audioEnabled);
            document.getElementById('audio-btn').innerText = audioEnabled ? "كتم الصوت 🔊" : "تشغيل الصوت 🔇";
        }
    </script>
</body>
</html>
